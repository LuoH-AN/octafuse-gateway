name: Build Octafuse v2.17.0 Cloudflare bundles
on:
  push:
    branches: [codex/build-octafuse-v2.17.0-20261031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OctaFuse/octafuse-gateway
          ref: 2d2b8fed5653620b97928dc0ff992eeed6371357
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:package-versions && npm run test:deploy
      - run: npm run build -w @octafuse/core
      - name: Bundle Proxy
        working-directory: packages/proxy
        run: npx wrangler deploy --dry-run --outdir ../../build-artifact/proxy
      - name: Build Admin and check types
        run: npm run build:cf -w @octafuse/admin
      - name: Bundle Admin
        working-directory: packages/admin
        run: npx wrangler deploy worker.ts --dry-run --outdir ../../build-artifact/admin
      - name: Package bundles and static assets
        run: |
          cp -a packages/admin/.open-next/assets build-artifact/assets
          git rev-parse HEAD > build-artifact/SOURCE_COMMIT
          cp package.json build-artifact/source-package.json
          tar -czf octafuse-v2.17.0-cloudflare.tar.gz -C build-artifact .
      - uses: actions/upload-artifact@v4
        with:
          name: octafuse-v2.17.0-cloudflare
          path: octafuse-v2.17.0-cloudflare.tar.gz
          retention-days: 7
